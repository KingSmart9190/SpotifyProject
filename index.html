<html lang="en">
<head>

            </svg>
            <h1>Spotify</h1>
            
        </div>
        <button onclick="authorizeUser()">Login with Spotify</button>
        <ul class="menu">
            <li><a href="#"><i class="icon-home"></i> Home</a></li>
            <li><a href="#"><i class="icon-search"></i> Search</a></li>
            <li><a href="#"><i class="icon-library"></i> Your Library</a></li>
        </ul>
        <div class="playlists">
            <h3>Playlists</h3>
            <ul>
                <li><a href="#">Discover Weekly</a></li>
                <li><a href="#">Release Radar</a></li>
                <li><a href="#">Liked Songs</a></li>
            </ul>
        </div>
    </div>

    <div class="main-container">
        <div class="topbar">
            <div class="navigation">
                <button class="nav-button"><i class="icon-back"></i></button>
                <button class="nav-button"><i class="icon-forward"></i></button>
            </div>
            <div class="search-bar">
                <input type="text" placeholder="Search for artists, songs, or podcasts">
            </div>
            <div class="user-profile">
                <img src="icons8-redragon.gif" alt="User Avatar" class="avatar">
                <span class="username">KingSmart</span>
            </div>
        </div>

        <div class="content">
            <h2>Good Evening</h2>
            <div class="grid">
                <div class="card"></div>
            </div>
            <h2>Recently Played</h2>
            <div class="grid">
                <div class="card" data-audio="Loreen-Tattoo.mp3">
                    <img src="Bite the Beat music and food festival logo.png" alt="Album 4">
                    <p>Loreen- Loreen-Tattoo</p>
                    <div class="play-button">
                        &#9658; <!-- Unicode character for play symbol -->
                    </div>
                </div>
                <div class="card" data-audio="lil wanye - mirror on the wall - Naija Songs -- Naijapals.mp3">
                    <img src="mirror.jpg" alt="Album 5">
                    <p>Lil Wayne- Mirror On the wall</p>
                    <div class="play-button">
                        &#9658;
                    </div>
                </div>
                <div class="card" data-audio="Abe_Parker_-_it_is_what_it_is-BAZEHITS.COM.mp3">
                    <img src="AbeParker.jpg" alt="Album 6">
                    <p>Abe Parker- It is what it is</p>
                    <div class="play-button">
                        &#9658;
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <audio id="audio-player" controls>
            <source id="audio-source" src="" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </footer>
    <script src="script.js"></script>
    <script src="https://sdk.scdn.co/spotify-player.js"></script>
    <script src="auth.js"></script>
</body>
</html>
